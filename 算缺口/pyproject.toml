[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "shipment-planner"
version = "0.1.0"
description = "CLI and PyQt desktop tool for shipment planning recommendations."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.8",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
ui = ["PyQt6>=6.6"]
build = ["PyQt6>=6.6", "pyinstaller>=6.0"]
dev = ["pytest>=8.0", "ruff>=0.8"]

[project.scripts]
shipment-planner = "shipment_planner.cli:main"
shipment-planner-eval = "shipment_planner.eval_forecast:main"
shipment-planner-ui = "planner_ui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
